name: Make story images
on:
  push:
    branches: [main]
    paths: [media-queue.json, scripts/make-images.py, .github/workflows/make-images.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency: make-images
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python scripts/make-images.py
      - name: Commit new images
        run: |
          git config user.name "devlens-bot"
          git config user.email "devlens-bot@users.noreply.github.com"
          git add public/media src/data/posts
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Add AI illustrations for new stories"
          git pull --rebase origin main
          git push origin HEAD:main
