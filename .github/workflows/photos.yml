name: Free-licence photos
on:
  workflow_dispatch:
    inputs:
      queries:
        description: 'JSON object of search key -> words, to search for candidates'
        required: false
  push:
    branches: [main]
    paths: [photo-queue.json, photo-searches.json]
permissions:
  contents: write
concurrency: photos
jobs:
  search:
    if: (github.event_name == 'workflow_dispatch' && inputs.queries != '') || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Decide whether to search
        id: q
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "run=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only HEAD~1 HEAD | grep -qx photo-searches.json; then echo "run=yes" >> "$GITHUB_OUTPUT"; else echo "run=no" >> "$GITHUB_OUTPUT"; fi
      - if: steps.q.outputs.run == 'yes'
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - if: steps.q.outputs.run == 'yes'
        run: pip install pillow
      - if: steps.q.outputs.run == 'yes'
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then export PHOTO_QUERIES="$(cat photo-searches.json)"; fi
          python scripts/photo-search.py
        env:
          PHOTO_QUERIES: ${{ inputs.queries }}
      - name: Publish candidates to the photo-candidates branch
        if: steps.q.outputs.run == 'yes'
        run: |
          cd candidates
          git init -q -b photo-candidates
          git config user.name "devlens-bot"
          git config user.email "devlens-bot@users.noreply.github.com"
          git add . && git commit -q -m "Photo candidates"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" photo-candidates
  fetch:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow
      - run: python scripts/fetch-photos.py
      - run: |
          git config user.name "devlens-bot"
          git config user.email "devlens-bot@users.noreply.github.com"
          git add public/media src/data/posts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add free-licence photos with credits"
          git pull --rebase origin main
          git push origin HEAD:main
