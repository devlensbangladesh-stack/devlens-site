name: Copy new images into the site
on:
  schedule:
    - cron: '30 19 * * *'   # 1:30am Dhaka, after the nightly update
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/mirror-media.mjs
      - run: |
          git config user.name "Devlens bot"
          git config user.email "devlensbangladesh@gmail.com"
          git add -A
          git commit -m "Copy new images into the site" || echo "Nothing new"
          git push
