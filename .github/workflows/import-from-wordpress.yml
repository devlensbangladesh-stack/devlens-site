name: Import from WordPress (run once)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/import-wp.mjs
      - run: node scripts/mirror-media.mjs
      - run: |
          git config user.name "Devlens bot"
          git config user.email "devlensbangladesh@gmail.com"
          git add -A
          git commit -m "Import content and images from WordPress" || echo "Nothing to commit"
          git push
